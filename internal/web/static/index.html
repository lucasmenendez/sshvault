<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>sshvault</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/sumi.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3 20 3m-3 3 2 2m-5 1 2 2"/></symbol>
    <symbol id="i-server" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4v-.2a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m-5 5 5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v12m-5-5 5 5 5-5"/><path d="M4 18v1a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-1"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/></symbol>
    <symbol id="i-eject" viewBox="0 0 24 24"><path d="m12 5-8 9h16z"/><path d="M4 18h16"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5"/><path d="M4 17v-5h5"/><path d="M6.1 9a7 7 0 0 1 11.6-2L20 12M4 12l2.3 5a7 7 0 0 0 11.6-2"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-unlock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 7.5-2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m20 6-11 11-5-5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M20 13 13 20 3 10V3h7z"/><circle cx="7.5" cy="7.5" r="1"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 21h20z"/><path d="M12 9v5M12 18h.01"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 6.2A10.4 10.4 0 0 1 12 6c6.5 0 10 6 10 6a16 16 0 0 1-3 3.5M6.6 6.6A16 16 0 0 0 2 12s3.5 6 10 6a10 10 0 0 0 4.1-.8"/></symbol>
    <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 3.4 8 8 9 4.6-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
  </svg>

  <div id="boot" class="boot">
    <div class="boot-mark"><svg class="icon"><use href="#i-shield"/></svg></div>
    <p>Loading sshvault…</p>
  </div>

  <div id="shell" class="shell" hidden>
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"><svg class="icon"><use href="#i-shield"/></svg></div>
        <div class="brand-text">
          <strong>sshvault</strong>
          <span id="brand-sub">encrypted vault</span>
        </div>
      </div>
      <nav class="nav" aria-label="Sections">
        <button class="nav-item" data-view="keys" type="button">
          <svg class="icon"><use href="#i-key"/></svg><span>Keys</span><span class="count" id="count-keys">0</span>
        </button>
        <button class="nav-item" data-view="hosts" type="button">
          <svg class="icon"><use href="#i-server"/></svg><span>Hosts</span><span class="count" id="count-hosts">0</span>
        </button>
        <button class="nav-item" data-view="files" type="button">
          <svg class="icon"><use href="#i-file"/></svg><span>Files</span><span class="count" id="count-files">0</span>
        </button>
      </nav>
      <div class="sidebar-bottom">
        <button class="nav-item" data-view="settings" type="button">
          <svg class="icon"><use href="#i-settings"/></svg><span>Settings</span>
        </button>
        <button class="nav-item" id="lock-now" type="button">
          <svg class="icon"><use href="#i-lock"/></svg><span>Lock vault</span>
        </button>
        <div class="side-meta">
          <span id="side-ssh">~/.ssh</span>
          <span id="side-version"></span>
        </div>
      </div>
    </aside>
    <main class="main">
      <header class="main-header" id="main-header"></header>
      <div id="banner"></div>
      <section id="view" class="view" aria-live="polite"></section>
    </main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
  <dialog id="modal" class="modal"></dialog>
  <dialog id="confirm" class="modal narrow"></dialog>

  <div id="lock" class="lock-screen" hidden>
    <form id="unlock-form" class="lock-card">
      <div class="lock-mark"><svg class="icon"><use href="#i-lock"/></svg></div>
      <h1 id="lock-title">Vault locked</h1>
      <p id="lock-description">Enter the vault password to continue.</p>
      <label class="field">
        <span>Password</span>
        <input type="password" id="unlock-password" autocomplete="current-password" required autofocus>
      </label>
      <label class="field" id="confirm-field" hidden>
        <span>Confirm password</span>
        <input type="password" id="unlock-confirm" autocomplete="new-password">
      </label>
      <p class="form-error" id="unlock-error" role="alert"></p>
      <button class="btn primary wide" id="unlock-submit" type="submit">Unlock</button>
      <div class="lock-actions">
        <button class="ghost small lock-open" id="open-vault-lock" type="button">Open existing vault…</button>
        <button class="ghost small lock-open" id="new-vault-lock" type="button">Create new vault…</button>
      </div>
    </form>
  </div>

  <div id="drop-overlay" class="drop-overlay" hidden>Import file</div>
  <script type="module" src="/app.js"></script>
</body>
</html>
